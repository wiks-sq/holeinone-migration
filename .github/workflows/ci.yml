# Runs on every push and pull request. Branch protection on main requires the
# "All checks passed" job, so nothing is merged unless every job below passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # used by release.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every PHP file
        run: |
          find hole-in-one-migration tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l -d display_errors=1 > lint.txt || { grep -v '^No syntax errors' lint.txt; exit 1; }
          echo "$(wc -l < lint.txt) files OK"

  version:
    name: Version numbers match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/check-version.sh

  e2e:
    name: Migration test (${{ matrix.name }})
    needs: [lint, version]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newest WordPress, PHP 8.5, Plugin Check
            wp_image: php8.5-apache
            cli_image: cli
            plugin_check: '1'
          # The oldest supported WordPress (6.2: wpdb::prepare() %i) on PHP 7.4.
          # The php7.4 images ship 6.1, so run.sh downloads 6.2 over it.
          - name: WordPress 6.2, PHP 7.4
            wp_image: php7.4-apache
            cli_image: cli-php7.4
            wp_version: '6.2'
            plugin_check: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the test exports with plugin 1.0.2 taken from git history
      - name: Run tests/e2e/run.sh
        env:
          WP_IMAGE: ${{ matrix.wp_image }}
          CLI_IMAGE: ${{ matrix.cli_image }}
          PLUGIN_CHECK: ${{ matrix.plugin_check }}
          WP_VERSION: ${{ matrix.wp_version }}
        run: tests/e2e/run.sh
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.wp_image }}
          path: |
            tests/e2e/e2e-results.log
            tests/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # One fixed name for branch protection to require, whatever the matrix holds.
  all:
    name: All checks passed
    if: always()
    needs: [lint, version, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false ]
