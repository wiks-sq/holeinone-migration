<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Hole-in-One Migration: a golf ball travels in small chunks from the old server into the hole on the new server">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a24"/>
      <stop offset="1" stop-color="#11463a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc47a"/>
      <stop offset="1" stop-color="#2e9a5b"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f1ee"/>
      <stop offset="1" stop-color="#c3d3cd"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd8d4"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#sky)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 140H1280M0 280H1280M0 420H1280M320 0V560M640 0V560M960 0V560"/>
  </g>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#3ddc97" font-size="20" font-weight="700" letter-spacing="3">FREE WORDPRESS PLUGIN</text>
    <text x="72" y="206" fill="#ffffff" font-size="64" font-weight="800">Hole-in-One</text>
    <text x="72" y="276" fill="#ffffff" font-size="64" font-weight="800">Migration</text>
    <text x="72" y="334" fill="#c9ded6" font-size="24">Move your whole WordPress site to a new host</text>
    <text x="72" y="366" fill="#c9ded6" font-size="24">in one shot. Chunked, resumable, no timeouts.</text>

    <g font-size="17" font-weight="600">
      <rect x="72" y="404" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#3ddc97" stroke-opacity="0.5"/>
      <text x="138" y="429" fill="#e6f5ef" text-anchor="middle">tar.gz · zip</text>
      <rect x="216" y="404" width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#3ddc97" stroke-opacity="0.5"/>
      <text x="300" y="429" fill="#e6f5ef" text-anchor="middle">Crash-resumable</text>
      <rect x="396" y="404" width="128" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#3ddc97" stroke-opacity="0.5"/>
      <text x="460" y="429" fill="#e6f5ef" text-anchor="middle">PHP 7.4–8.5</text>
      <rect x="72" y="454" width="226" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#3ddc97" stroke-opacity="0.5"/>
      <text x="185" y="479" fill="#e6f5ef" text-anchor="middle">Tested with 5 GB+ sites</text>
      <rect x="310" y="454" width="140" height="38" rx="19" fill="#3ddc97"/>
      <text x="380" y="479" fill="#0b2a24" text-anchor="middle" font-weight="800">100% free</text>
    </g>
  </g>

  <!-- putting green -->
  <ellipse cx="1010" cy="468" rx="236" ry="58" fill="#1f6e46"/>
  <ellipse cx="1010" cy="458" rx="226" ry="52" fill="url(#green)"/>
  <ellipse cx="1060" cy="464" rx="24" ry="8" fill="#0b2a24"/>
  <!-- flag -->
  <line x1="1112" y1="456" x2="1112" y2="300" stroke="#f4f7f6" stroke-width="5" stroke-linecap="round"/>
  <path d="M1114 302 L1184 324 L1114 346 Z" fill="#ff5d5d"/>

  <!-- old server -->
  <g transform="translate(676 352)">
    <rect width="120" height="138" rx="12" fill="url(#server)"/>
    <rect x="14" y="16" width="92" height="28" rx="6" fill="#9fb5ad"/>
    <rect x="14" y="54" width="92" height="28" rx="6" fill="#9fb5ad"/>
    <rect x="14" y="92" width="92" height="28" rx="6" fill="#9fb5ad"/>
    <circle cx="92" cy="30" r="5" fill="#3ddc97"/>
    <circle cx="92" cy="68" r="5" fill="#3ddc97"/>
    <circle cx="92" cy="106" r="5" fill="#3ddc97"/>
    <text x="60" y="166" fill="#c9ded6" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">old host</text>
  </g>
  <text x="1010" y="546" fill="#c9ded6" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">new host</text>

  <!-- trajectory made of chunks -->
  <g fill="#3ddc97">
    <rect x="782" y="318" width="14" height="14" rx="3" opacity="0.35"/>
    <rect x="814" y="262" width="14" height="14" rx="3" opacity="0.45"/>
    <rect x="852" y="216" width="14" height="14" rx="3" opacity="0.55"/>
    <rect x="896" y="182" width="14" height="14" rx="3" opacity="0.65"/>
    <rect x="944" y="164" width="14" height="14" rx="3" opacity="0.75"/>
    <rect x="994" y="166" width="14" height="14" rx="3" opacity="0.85"/>
    <rect x="1036" y="190" width="14" height="14" rx="3" opacity="0.92"/>
    <rect x="1060" y="240" width="14" height="14" rx="3"/>
  </g>
  <!-- ball dropping in -->
  <rect x="1050" y="300" width="14" height="14" rx="3" fill="#3ddc97"/>
  <rect x="1052" y="362" width="14" height="14" rx="3" fill="#3ddc97"/>
  <circle cx="1060" cy="448" r="15" fill="url(#ball)"/>
  <g fill="#b9c6c1">
    <circle cx="1054" cy="443" r="1.6"/><circle cx="1062" cy="441" r="1.6"/><circle cx="1067" cy="448" r="1.6"/>
    <circle cx="1057" cy="451" r="1.6"/><circle cx="1064" cy="455" r="1.6"/>
  </g>
</svg>
